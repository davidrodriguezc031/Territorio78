name: Copiar bibliotecas de exportación (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Descargar html2canvas 1.4.1 y jsPDF 2.5.1 (licencia MIT)
        run: |
          mkdir -p sitio/censo/vendor
          npm pack html2canvas@1.4.1 jspdf@2.5.1 --silent
          tar -xzf html2canvas-1.4.1.tgz && cp package/dist/html2canvas.min.js sitio/censo/vendor/ && cp package/LICENSE sitio/censo/vendor/LICENSE-html2canvas.txt && rm -rf package
          tar -xzf jspdf-2.5.1.tgz && cp package/dist/jspdf.umd.min.js sitio/censo/vendor/ && cp package/LICENSE sitio/censo/vendor/LICENSE-jspdf.txt && rm -rf package
          rm -f *.tgz; ls -la sitio/censo/vendor
          sha256sum sitio/censo/vendor/*.js
      - name: Guardar
        run: |
          git config user.name "territorio78-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitio/censo/vendor
          git commit -m "Bibliotecas de exportación PDF/JPEG (html2canvas 1.4.1, jsPDF 2.5.1, MIT)"
          git push
