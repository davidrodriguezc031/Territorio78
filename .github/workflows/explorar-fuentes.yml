name: Explorar fuentes demográficas (temporal)
on: workflow_dispatch
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Census PEP V2025
        run: |
          for u in \
            https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/state/totals/NST-EST2025-ALLDATA.csv \
            https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/puerto-rico/asrh/cc-est2025-agesex-72.csv; do
            echo "== $u"; curl -sSfL "$u" -o f.csv && wc -c f.csv && head -c 600 f.csv; echo; grep -m3 -i "puerto" f.csv | cut -c1-400; done
          echo "== directorio municipios"; curl -sSfL https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/municipios/totals/ | grep -o 'href="[^"]*"' | head -30
          echo "== directorio puerto-rico"; curl -sSfL https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/puerto-rico/ | grep -o 'href="[^"]*"' | head -30
      - name: UN WPP 2024
        run: |
          for u in \
            "https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Life_Table_Abridged_Medium_1950-2023.csv.gz" \
            "https://population.un.org/wpp/Download/Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Life_Table_Abridged_Medium_1950-2023.csv.gz"; do
            echo "== $u"; curl -sSL -o lt.gz -w "%{http_code} %{size_download}\n" "$u"; file lt.gz; done
          git clone -q --depth 1 https://github.com/PPgp/wpp2024 wpp && ls -la wpp/data | head -80
